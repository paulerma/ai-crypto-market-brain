name: Trend transition detector

on:
  push:
    paths:
      - '.github/workflows/trend-transition.yml'
      - '.github/scripts/add_lateral_and_price_targets.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add lateral range and price targets
        run: python .github/scripts/add_lateral_and_price_targets.py

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Add lateral range and directional price targets"
            git push
          fi
