name: Validate market brain

on:
  push:
    paths:
      - 'app.py'
      - 'src/engines/pattern_engine.py'
      - '.github/workflows/trend-transition.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: |
          python -m py_compile app.py
          python -m py_compile src/engines/pattern_engine.py
