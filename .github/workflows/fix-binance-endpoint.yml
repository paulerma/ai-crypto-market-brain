name: Fix Binance market-data endpoint

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace blocked Binance endpoint with official market-data-only endpoint
        run: |
          sed -i 's#https://api.binance.com#https://data-api.binance.vision#g' app.py src/market_context.py
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py src/market_context.py
          git commit -m "Fix Binance public market-data endpoint for cloud deployment"
          git push
