name: Simple all-timeframes market view

on:
  push:
    paths:
      - '.github/workflows/simple-all-timeframes.yml'
      - '.github/scripts/make_binary_direction.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make main signal binary up or down
        run: python .github/scripts/make_binary_direction.py

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Make simple signal primarily up or down"
            git push
          fi
