name: Simple all-timeframes market view

on:
  push:
    paths:
      - '.github/workflows/simple-all-timeframes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simplify UI and enable all TradingView timeframes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.py')
          s = p.read_text()

          # Cache expensive work longer. Accuracy logic is unchanged; this only
          # avoids recomputing the same validated models on every Streamlit rerun.
          s = re.sub(
              r'@st\.cache_data\(ttl=30, show_spinner=False\)\ndef fetch_binance_history',
              '@st.cache_data(ttl=90, max_entries=64, show_spinner=False)\ndef fetch_binance_history',
              s,
              count=1,
          )
          s = re.sub(
              r'@st\.cache_data\(ttl=30, show_spinner=False\)\ndef fetch_timeframe_history',
              '@st.cache_data(ttl=90, max_entries=64, show_spinner=False)\ndef fetch_timeframe_history',
              s,
              count=1,
          )
          s = re.sub(
              r'@st\.cache_data\(ttl=300, show_spinner=False\)\ndef model_signal',
              '@st.cache_data(ttl=900, max_entries=48, show_spinner=False)\ndef model_signal',
              s,
              count=1,
          )

          # Cache the optional expensive multi-horizon analyses too.
          if '@st.cache_data(ttl=900, max_entries=12, show_spinner=False)\ndef build_timing_rows' not in s:
              s = s.replace(
                  'def build_timing_rows(symbol_code: str):',
                  '@st.cache_data(ttl=900, max_entries=12, show_spinner=False)\ndef build_timing_rows(symbol_code: str):',
                  1,
              )
          if '@st.cache_data(ttl=900, max_entries=24, show_spinner=False)\ndef build_candle_radar' not in s:
              s = s.replace(
                  'def build_candle_radar(symbol_code: str, timeframe: str, history_bars: int):',
                  '@st.cache_data(ttl=900, max_entries=24, show_spinner=False)\ndef build_candle_radar(symbol_code: str, timeframe: str, history_bars: int):',
                  1,
              )

          old_tf = '''    TIMEFRAME_UI = {
        "1 minuto": "1m",
        "5 minutos": "5m",
        "15 minutos": "15m",
        "1 hora": "1h",
        "4 horas": "4h",
        "1 día": "1D",
        "1 semana": "1W",
        "1 mes": "1M",
    }'''
          new_tf = '''    TIMEFRAME_UI = {
        "1 minuto": "1m",
        "2 minutos": "2m",
        "3 minutos": "3m",
        "5 minutos": "5m",
        "10 minutos": "10m",
        "15 minutos": "15m",
        "30 minutos": "30m",
        "45 minutos": "45m",
        "1 hora": "1h",
        "2 horas": "2h",
        "3 horas": "3h",
        "4 horas": "4h",
        "1 día": "1D",
        "1 semana": "1W",
        "1 mes": "1M",
    }'''
          if old_tf not in s:
              raise SystemExit('TIMEFRAME_UI block not found')
          s = s.replace(old_tf, new_tf, 1)

          helpers = r'''

def _strict_simple_state(signal):
    """Only expose a colored state when the evidence passes conservative checks."""
    if not signal.get("ok") or not signal.get("model_validated"):
        return None
    rel = reliability_level(signal)
    if rel not in ("MEDIA", "ALTA"):
        return None
    dom, prob, margin = scenario_from_probs(signal["pup"], signal["pflat"], signal["pdown"])
    if prob < 0.45 or margin < 0.06:
        return None
    if float(signal.get("model_agreement", 0.0)) < (2/3):
        return None
    if signal.get("analog_agreement") is False:
        return None
    return {"scenario": dom, "probability": float(prob), "reliability": rel, "source": "modelo validado"}


@st.cache_data(ttl=1800, max_entries=16, show_spinner=False)
def monthly_consensus_state(symbol_code: str):
    """Very selective monthly state: daily + weekly validated models + monthly cycle context.

    Monthly candles alone do not provide enough independent samples for the same
    strict ML validation. Therefore 1M is colored only when shorter validated
    horizons agree with the monthly trend. Otherwise it returns no signal.
    """
    model_votes = []
    for tf, history, horizon in (("1D", 1000, 30), ("1W", 520, 4)):
        raw = fetch_timeframe_history(symbol_code, tf, history + 2)
        closed = raw[raw.is_closed].drop(columns=["is_closed"]).tail(history).reset_index(drop=True)
        res = model_signal(closed, horizon=horizon, deep=False)
        state = _strict_simple_state(res)
        if state:
            model_votes.append(state)

    raw_m = fetch_timeframe_history(symbol_code, "1M", DEFAULT_HISTORY["1M"] + 2)
    m = raw_m[raw_m.is_closed].drop(columns=["is_closed"]).reset_index(drop=True)
    if len(m) < 30:
        return None
    close = m["close"].astype(float)
    ema6 = close.ewm(span=6, adjust=False).mean().iloc[-1]
    ema12 = close.ewm(span=12, adjust=False).mean().iloc[-1]
    ema24 = close.ewm(span=24, adjust=False).mean().iloc[-1]
    mom3 = close.iloc[-1] / close.iloc[-4] - 1 if len(close) >= 4 else 0.0
    mom6 = close.iloc[-1] / close.iloc[-7] - 1 if len(close) >= 7 else 0.0

    tech = None
    if close.iloc[-1] > ema6 > ema12 > ema24 and mom3 > 0 and mom6 > 0:
        tech = "SUBIDA"
    elif close.iloc[-1] < ema6 < ema12 < ema24 and mom3 < 0 and mom6 < 0:
        tech = "BAJADA"
    elif abs(mom3) < 0.06 and abs(close.iloc[-1] / ema12 - 1) < 0.06:
        tech = "LATERAL"

    if len(model_votes) < 2:
        return None
    if model_votes[0]["scenario"] != model_votes[1]["scenario"]:
        return None
    dom = model_votes[0]["scenario"]
    if tech != dom:
        return None
    prob = (model_votes[0]["probability"] + model_votes[1]["probability"]) / 2
    rel = "ALTA" if all(v["reliability"] == "ALTA" for v in model_votes) else "MEDIA"
    return {"scenario": dom, "probability": float(prob), "reliability": rel,
            "source": "1D + 1W + ciclo mensual"}


def simple_signal_chart(df, symbol, timeframe, horizon, state, simple_forecast=None):
    """Clean chart: candles + one colored forecast zone + one invalidation line."""
    fig = go.Figure()
    fig.add_trace(go.Candlestick(
        x=df.timestamp, open=df.open, high=df.high, low=df.low, close=df.close,
        name="Precio", increasing_line_color="#2ecc71", decreasing_line_color="#ff5c5c",
    ))
    palette = {
        "SUBIDA": ("#2ecc71", "rgba(46,204,113,.14)", "ALCISTA"),
        "BAJADA": ("#ff5c5c", "rgba(255,92,92,.14)", "BAJISTA"),
        "LATERAL": ("#f2c94c", "rgba(242,201,76,.14)", "LATERAL"),
    }
    last_x = pd.Timestamp(df.timestamp.iloc[-1])
    last_y = float(df.close.iloc[-1])

    if state:
        sc = state["scenario"]
        line_color, fill_color, label = palette[sc]
        try:
            end_x = pd.Timestamp(future_time(last_x.to_pydatetime(), timeframe, int(horizon)))
        except Exception:
            end_x = last_x

        zone = None
        plan = None
        if simple_forecast is not None:
            if sc == "SUBIDA":
                zone, plan = simple_forecast.up, simple_forecast.long_plan
            elif sc == "BAJADA":
                zone, plan = simple_forecast.down, simple_forecast.short_plan
            else:
                zone = simple_forecast.flat

        if zone is not None and end_x > last_x:
            fig.add_shape(
                type="rect", x0=last_x, x1=end_x, y0=float(zone.low), y1=float(zone.high),
                fillcolor=fill_color, line={"color": line_color, "width": 1}, layer="below",
            )
            fig.add_annotation(x=end_x, y=(float(zone.low)+float(zone.high))/2,
                               text=f"{label}<br>{state['probability']*100:.0f}%",
                               showarrow=False, font={"color": line_color, "size": 15},
                               bgcolor="rgba(8,11,15,.78)")
        else:
            fig.add_annotation(x=last_x, y=last_y, text=f"{label} · {state['probability']*100:.0f}%",
                               showarrow=True, arrowcolor=line_color,
                               font={"color": line_color, "size": 15}, bgcolor="rgba(8,11,15,.78)")

        if plan is not None and sc in ("SUBIDA", "BAJADA"):
            fig.add_hline(y=float(plan.stop), line_dash="dot", line_color=line_color,
                          annotation_text="Invalidación")
    else:
        fig.add_annotation(x=last_x, y=last_y, text="SIN SEÑAL SUFICIENTEMENTE FIABLE",
                           showarrow=True, font={"color": "#b7bec7", "size": 14},
                           bgcolor="rgba(8,11,15,.82)")

    fig.update_layout(
        template="plotly_dark", paper_bgcolor="#080b0f", plot_bgcolor="#080b0f",
        height=650, margin=dict(l=8, r=8, t=38, b=8), xaxis_rangeslider_visible=False,
        hovermode="x unified", dragmode="pan", showlegend=False,
        uirevision=f"simple-{symbol}-{timeframe}",
    )
    fig.update_xaxes(gridcolor="#171d24", fixedrange=False, showspikes=True, spikemode="across")
    fig.update_yaxes(gridcolor="#171d24", fixedrange=False, side="right")
    return fig
'''

          marker = '\ndef store_df(key, value):\n'
          if '_strict_simple_state' not in s:
              if marker not in s:
                  raise SystemExit('helper insertion marker not found')
              s = s.replace(marker, helpers + marker, 1)

          simple_branch = r'''

# ------------------------- Ultra-simple mode -------------------------
if ui_mode == "Sencillo":
    if timeframe == "1M":
        with st.spinner("Confirmando contexto mensual con diario, semanal y ciclo..."):
            simple_state = monthly_consensus_state(SYMBOLS[selected])
    else:
        simple_state = _strict_simple_state(signal)

    if simple_state:
        sc = simple_state["scenario"]
        icon = "🟢" if sc == "SUBIDA" else "🔴" if sc == "BAJADA" else "🟡"
        label = "ALCISTA" if sc == "SUBIDA" else "BAJISTA" if sc == "BAJADA" else "LATERAL"
        st.markdown(f"## {icon} {selected} · {label}")
        st.caption(
            f"{timeframe_label} · evidencia {simple_state['reliability'].lower()} · "
            f"probabilidad estimada {simple_state['probability']*100:.1f}% · {simple_state['source']}"
        )
    else:
        st.markdown(f"## ⚪ {selected} · SIN SEÑAL CLARA")
        st.caption(f"{timeframe_label} · el sistema no pinta verde/rojo/amarillo si la evidencia no supera el filtro de fiabilidad.")

    fig_simple = simple_signal_chart(
        display_df, selected, timeframe, horizon, simple_state, simple_forecast
    )
    st.plotly_chart(fig_simple, width="stretch", theme=None,
                    key=f"simple_main_{selected}_{timeframe}_{horizon}", config=plot_config())

    if simple_state:
        alert_key = f"simple_last_state::{selected}::{timeframe}"
        previous = st.session_state.get(alert_key)
        current = simple_state["scenario"]
        if previous is not None and previous != current:
            msg = "SUBIDA" if current == "SUBIDA" else "BAJADA" if current == "BAJADA" else "LATERAL"
            st.toast(f"Cambio detectado en {selected} {timeframe_label}: {msg}", icon="🔔")
        st.session_state[alert_key] = current

    st.caption("La complejidad queda detrás: ciclos, patrones, volumen, estadísticas, validación fuera de muestra y consenso. La gráfica solo colorea cuando la evidencia supera el filtro.")
    st.stop()
'''

          marker2 = '\n_top_dom = max('
          if 'Ultra-simple mode' not in s:
              if marker2 not in s:
                  raise SystemExit('simple branch insertion marker not found')
              s = s.replace(marker2, simple_branch + marker2, 1)

          # In simple mode these panels are not rendered. Keep advanced mode unchanged.
          p.write_text(s)
          PY

      - name: Syntax check
        run: python - <<'PY'
          import ast
          ast.parse(open('app.py').read())
          print('app.py syntax OK')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Simplify chart and add all 1m-to-1M timeframes"
            git push
          fi
