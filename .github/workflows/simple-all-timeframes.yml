name: Simple all-timeframes market view

on:
  push:
    paths:
      - '.github/workflows/simple-all-timeframes.yml'
      - '.github/scripts/simplify_signal_first_ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make signal the whole simple experience
        run: python .github/scripts/simplify_signal_first_ui.py

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Simplify simple mode around the direction signal"
            git push
          fi
